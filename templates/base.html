<style>
 .kanban-column {
    background-color: rgb(190, 190, 190); /* clean neutral */
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    min-height: 250px;
}

.kanban-title {
    font-weight: 700;
    font-size: 1rem;
    color: #111827;
    margin-bottom: 12px;
}

.kanban-card {
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    transition: transform 0.15s ease;
}

.kanban-card:hover {
    transform: translateY(-2px);
}

.kanban-card.in-progress {
    background-color: #14b8a6; /* teal */
}

.kanban-card.not-started {
    background-color: #f97316; /* bright orange */
}

.kanban-card.on-hold{
    background-color: rgb(141, 136, 136);
}
</style>
<body>
    <div class="container-fluid">
        {% block content %}
        {% endblock %}
    </div>
</body>
